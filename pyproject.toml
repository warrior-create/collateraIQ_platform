[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "collateraliq"
version = "0.1.0"
description = "CollateralIQ: Client Exposure, Collateral and Initial Margin Platform for CEM Desks"
authors = [{ name = "Credit Risk Methodology Group" }]
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "psycopg2-binary>=2.9",
  "pandas>=2.1",
  "scipy>=1.12",
  "statsmodels>=0.14",
  "arch>=6.3",
  "yfinance>=0.2.38",
  "fredapi>=0.5",
  "sqlalchemy>=2.0",
  "openpyxl>=3.1",
  "plotly>=5.20",
  "matplotlib>=3.8",
  "streamlit>=1.35",
  "pyyaml>=6.0",
  "click>=8.1",
  "rich>=13.7",
  "reportlab>=4.1",
  "requests>=2.31",
  "tqdm>=4.66",
  "fastapi>=0.100",
  "uvicorn>=0.23",
  "python-multipart>=0.0.6",
  "httpx>=0.26",
  "scikit-learn>=1.4",
  "numba>=0.59",
  "xlwings>=0.30",
  "tabulate>=0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "black>=24.0",
  "hypothesis>=6.100",
  "pytest-asyncio>=0.23",
]

[project.scripts]
collateraliq = "collateraliq.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=collateraliq --cov-report=term-missing -v"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.coverage.run]
source = ["src/collateraliq"]
omit = ["*/tests/*", "*/__init__.py"]
